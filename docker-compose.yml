services:
  bot:
    build: .
    image: sklad-bot:latest
    container_name: sklad-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Укажи BOT_TOKEN в переменных окружения стека}
      PAGE_SIZE: ${PAGE_SIZE:-10}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - sklad_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  sklad_data:
