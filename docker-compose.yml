services:
  bot:
    build: .
    image: sklad-bot:latest
    container_name: sklad-bot
    restart: unless-stopped
    environment:
      # В Portainer: Stacks → твой стек → Environment variables → BOT_TOKEN
      BOT_TOKEN: ${BOT_TOKEN:?Укажи BOT_TOKEN в переменных окружения стека}
      PAGE_SIZE: ${PAGE_SIZE:-10}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - sklad_data:/app/data  # SQLite-база warehouse.db — переживает пересборку и обновления
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sklad_data:
